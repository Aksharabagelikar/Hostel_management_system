<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Hostel Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="theme-admin">
<div class="login-page">
  <div class="login-card">
    <img src="/images/logo.svg" class="logo" alt="logo">
    <h4 class="text-center fw-bold mb-0">Hostel Management System</h4>
    <p class="text-center text-muted mb-4">Sign in to continue</p>

    <div id="loginError" class="alert alert-danger d-none py-2"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="username" required autofocus autocomplete="username">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" required autocomplete="current-password">
        </div>
      </div>
      <button class="btn btn-primary w-100 py-2" id="loginBtn" type="submit">Login</button>
    </form>

    <div class="demo-box mt-4">
      <div class="fw-semibold mb-2"><i class="bi bi-info-circle"></i> Demo accounts (click to fill)</div>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-outline-primary btn-sm" onclick="fill('admin','admin123')">Admin</button>
        <button type="button" class="btn btn-outline-primary btn-sm" onclick="fill('warden','warden123')">Warden</button>
        <button type="button" class="btn btn-outline-success btn-sm" onclick="fill('student','student123')">Student</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
